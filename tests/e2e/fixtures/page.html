<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Vimput E2E Fixture</title>
  </head>
  <body>
    <h1>Vimput E2E Fixture</h1>
    <p>
      <label for="ta">textarea</label><br />
      <textarea id="ta" rows="8" cols="40"></textarea>
    </p>
    <p>
      <label for="inp">input[type=text]</label><br />
      <input id="inp" type="text" size="40" />
    </p>
    <p>
      <label for="ce">contenteditable</label><br />
      <div id="ce" contenteditable="true" style="border: 1px solid #ccc; min-height: 2em; width: 400px"></div>
    </p>
  </body>
</html>
