<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Vim for Text Fields - E2E Fixture</title>
  </head>
  <body>
    <h1>受け入れテスト用フィクスチャページ</h1>

    <p><label for="textarea">textarea</label></p>
    <textarea id="textarea" rows="6" cols="40"></textarea>

    <p><label for="input">input[type=text]</label></p>
    <input id="input" type="text" />

    <p><label for="editable">contenteditable</label></p>
    <div id="editable" contenteditable="true"></div>
  </body>
</html>
