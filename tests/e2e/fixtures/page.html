<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Vim for Text Fields - 受け入れテスト用ページ</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      textarea {
        width: 400px;
        height: 120px;
      }
      input[type="text"] {
        width: 400px;
      }
      #ce {
        width: 400px;
        min-height: 60px;
        border: 1px solid #999;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <label>textarea<br /><textarea id="ta"></textarea></label>
    <label>input<br /><input id="inp" type="text" /></label>
    <label>contenteditable<br /><div id="ce" contenteditable="true"></div></label>
  </body>
</html>
