name: "🤖 Claude 実装依頼"
description: "実装・修正してほしい内容を書いて作成すると、Claude Codeが自動で着手しPull Requestを作成します"
title: "[Claude] "
labels: ["claude"]
body:
  - type: markdown
    attributes:
      value: |
        このissueを作成すると、GitHub Actions経由でClaude Codeが自動的に着手し、Pull Requestを作成します。
        手戻りなく実装できるよう、できるだけ具体的に記入してください。

  - type: dropdown
    id: type
    attributes:
      label: 種別
      options:
        - バグ修正
        - 新機能
        - 改善・リファクタリング
        - その他
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 現状
      description: 今どうなっているか、何が問題か・何ができないかを書いてください。
      placeholder: |
        例: Normalモードで `dd` を実行すると、カーソルの列位置が行頭にリセットされてしまう
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
      description: 実装・修正後にどうなってほしいかを書いてください。
      placeholder: |
        例: `dd` の実行前後でカーソルの列位置(desiredCol)が維持されてほしい
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順(バグ修正の場合)
      description: バグの場合、現状を再現できる具体的な手順を書いてください。新機能・改善の場合は空欄で構いません。
      placeholder: |
        1. textareaにフォーカスし `iabc<Esc>` と入力
        2. `dd` を実行
        3. `j` で次の行に移動 → 列位置がずれている
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 完了の条件
      description: どうなっていれば完了とみなせるか、確認方法を箇条書きで書いてください。
      placeholder: |
        - 上記の再現手順で列位置がずれないこと
        - 既存の他の操作(h/j/k/l、他のオペレータ等)に影響がないこと
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 対象外・やらないこと
      description: 触ってほしくないファイルや、今回は含めない変更があれば書いてください(任意)。
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 参考・補足
      description: 関連ファイル・箇所、参考リンク、スクリーンショットなどがあれば書いてください(任意)。
    validations:
      required: false

  - type: textarea
    id: trigger
    attributes:
      label: Claude 実行トリガー(編集・削除しないでください)
      description: 下の一文がこのissueにClaudeを起動させるトリガーです。
      value: "@claude 上記の内容に沿って実装し、Pull Requestを作成してください。"
    validations:
      required: true
